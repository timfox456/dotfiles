# ~/.config/keyd/app.conf — per-application overrides for keyd.
#
# keyd-application-mapper (started from the i3 config) watches the focused
# window and applies the sections matching its class on top of
# /etc/keyd/default.conf (etc/keyd/default.conf in this repo). Edits are
# picked up on the next focus change, no restart needed.
#
# Class matching: the mapper lowercases the window class and turns every run
# of non-alphanumerics into '-', so Ghostty's X11 class com.mitchellh.ghostty
# is matched as com-mitchellh-ghostty. Find a class with:
#   keyd-application-mapper -v     (then focus the window)
# '|' in a header separates class from TITLE — it is not "or", hence one
# section per terminal below. Every matching section is applied.
#
# Terminals: Cmd-style keys become the Ctrl+Shift variants terminals use for
# their own actions; keys whose plain Ctrl form means something to the shell
# (C-z suspend, C-x, C-s XOFF, C-r history search, C-l clear, C-o, C-p) are
# disabled so a Mac reflex never sends them. C-a is tmux's prefix on servers.

[*ghostty*]
meta.c = C-S-c
meta.v = C-S-v
meta.t = C-S-t
meta.w = C-S-w
meta.n = C-S-n
meta.f = C-S-f
meta.a = C-S-a
meta.q = C-S-q
meta.x = noop
meta.z = noop
meta.s = noop
meta.r = noop
meta.l = noop
meta.o = noop
meta.p = noop

