# Server tmux config (always Linux, prefix C-a).
# tmux is essential here, not a nicety: sessions must survive reboots,
# autosave must be aggressive, and killing a session must never drop the client.

# Leader key: C-a (desktop uses the default C-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# System clipboard over SSH via OSC 52 (requires tmux >= 3.3)
set -g set-clipboard on

# --- Server-first tuning ----------------------------------------------------
# Autosave every 5 minutes (default 15) — aggressive because sessions ARE the work
set -g @continuum-save-interval '5'
# Start the tmux server at machine boot (systemd user unit; also run
# `loginctl enable-linger $USER` once). Pairs with @continuum-restore above.
set -g @continuum-boot 'on'
# Killing a project session switches to another session instead of detaching
set -g detach-on-destroy off

source-file -q ~/.config/tmux/common.conf
