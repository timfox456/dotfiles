# aerc accounts — stowed into the public repo. NO secrets live here:
# the OAuth token file is ~/.local/share/aerc/ (machine-local, encrypted by
# mutt_oauth2.py). Replace you@gmail.com with your address (URL-encode @ as %40),
# then complete the one-time authorize step (see README "Gmail via aerc").

[Gmail]
from = Your Name <you@gmail.com>
source = imaps://you%40gmail.com@imap.gmail.com:993
imap-auth = xoauth2
source-cred-cmd = ~/.config/aerc/mutt_oauth2.py ~/.local/share/aerc/token.gmail
outgoing = smtp+starttls://you%40gmail.com@smtp.gmail.com:587
smtp-auth = xoauth2
outgoing-cred-cmd = ~/.config/aerc/mutt_oauth2.py ~/.local/share/aerc/token.gmail
default = INBOX
copy-to = INBOX
