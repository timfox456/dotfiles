# /etc/keyd/default.conf — system-wide keyd config (Linux desktops only).
#
# NOT a stow package: keyd runs as root and reads /etc/keyd/*.conf, so
# install-deps.sh COPIES this file there (sudo) and runs `keyd reload`.
# After editing it, rerun ./install-deps.sh, or by hand:
#   sudo install -m644 etc/keyd/default.conf /etc/keyd/default.conf && sudo keyd reload
#
# Mac-style Cmd shortcuts on the Super key, Omarchy-style. i3's $mod is Alt,
# so Super is free. Only the keys listed in [meta] change; every other
# Super+key still reaches apps unchanged. Shift is preserved, so Super+Shift+Z
# becomes Ctrl+Shift+Z (redo).
#
# Terminals need Ctrl+SHIFT+C/V and must NOT receive a raw Ctrl+C/Z/A —
# ~/.config/keyd/app.conf (keyd package, applied per focused window by
# keyd-application-mapper) overrides these bindings for terminal windows.

[ids]
*

[main]
# Caps Lock: Esc on tap, Control on hold (matches karabiner/ on macOS).
capslock = overload(control, esc)

[meta]
a = C-a
c = C-c
v = C-v
x = C-x
z = C-z
s = C-s
f = C-f
t = C-t
w = C-w
n = C-n
q = C-q
r = C-r
l = C-l
o = C-o
p = C-p
equal = C-equal
minus = C-minus
0 = C-0
# Back / forward (Cmd-[ / Cmd-])
leftbrace = A-left
rightbrace = A-right
# Text navigation: line start/end, document start/end
left = home
right = end
up = C-home
down = C-end
